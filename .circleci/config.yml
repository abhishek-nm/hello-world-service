version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11

    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Build & Push Docker image
          command: |
            docker login -u $DOCKERHUB_USER -p $DOCKERHUB_TOKEN

            docker build -t $DOCKERHUB_USER/hello-world:${CIRCLE_SHA1} .
            docker push $DOCKERHUB_USER/hello-world:${CIRCLE_SHA1}

      - run:
          name: Update GitOps repo
          command: |
            git clone git@github.com:abhishek-nm/gitops-config.git
            cd gitops-config/apps/hello-world

            sed -i "s/^ *tag:.*/  tag: ${CIRCLE_SHA1}/" values.yaml

            git config user.email "ci@circleci"
            git config user.name "circleci"
            git add values.yaml
            git commit -m "hello-world → ${CIRCLE_SHA1}"
            git push

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build

