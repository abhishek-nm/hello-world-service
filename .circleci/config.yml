version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Build Docker image
          command: |
            docker build -t hello-world:${CIRCLE_SHA1} .

      - run:
          name: Update GitOps repo
          command: |
            git clone https://github.com/abhishek-nm/gitops-config.git
            cd gitops-config/apps/hello-world
            sed -i '' "s/tag:.*/tag: ${CIRCLE_SHA1}/" values.yaml
            git config user.email "ci@circleci"
            git config user.name "circleci"
            git commit -am "hello-world → ${CIRCLE_SHA1}"
            git push

