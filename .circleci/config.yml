version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11

    steps:
      - checkout

      # 🔐 Explicitly load SSH key
      - add_ssh_keys:
          fingerprints:
            - "SHA256:s91Bb/JFs6lu3A4NrTU2WyXCmmqXXwkYpg3PL/bKkvI"

      # 🔐 Trust GitHub host
      - run:
          name: Trust GitHub SSH host
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: |
            docker build -t hello-world:${CIRCLE_SHA1} .

      - run:
          name: Update GitOps repo
          command: |
            ssh -T git@github.com || true

            git clone git@github.com:abhishek-nm/gitops-config.git
            cd gitops-config/apps/hello-world

            sed -i "s/^ *tag:.*/  tag: ${CIRCLE_SHA1}/" values.yaml

            git config user.email "ci@circleci"
            git config user.name "circleci"
            git add values.yaml
            git commit -m "hello-world → ${CIRCLE_SHA1}"
            git push

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
